<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matt Ellison — Finance</title>
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  :root{
    --cream:#fbf3e6;
    --ink:#2a2118;
    --gold:#d7b25a;
    --line:rgba(255,255,255,0.16);
    --sp:0;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Iowan Old Style','Georgia',serif;
    color:var(--ink);
  }

  h1,h2,h3{
    font-family:'Iowan Old Style','Georgia',serif;
    font-weight:600;
    margin:0;
  }

  p, a, li, span, label, input, textarea, button{
    font-family:'Helvetica Neue',Arial,sans-serif;
  }

  a{color:inherit;text-decoration:none;}

  /* ---------- NAV ---------- */
  nav{
    position:fixed;
    top:0; left:0; right:0;
    display:flex;
    justify-content:flex-end;
    gap:28px;
    padding:22px 40px;
    z-index:50;
    font-size:14px;
    letter-spacing:0.02em;
    mix-blend-mode:difference;
    color:#fff;
  }
  nav a{opacity:0.85; transition:opacity .2s;}
  nav a:hover{opacity:1;}

  /* ---------- FIXED FULL-PAGE OCEAN SCENE ---------- */
  #scene{
    position:fixed;
    inset:0;
    z-index:-1;
    overflow:hidden;
    background:#0a2a3d;
  }

  .water-shallow, .water-deep{
    position:absolute; inset:0;
  }
  .water-shallow{
    background:linear-gradient(180deg,
      #7fd8e8 0%,
      #4bb8d6 20%,
      #2a8fbf 42%,
      #1c6a9e 64%,
      #124a78 84%,
      #0a2d52 100%);
  }
  .water-deep{
    background:linear-gradient(180deg,
      #133a52 0%,
      #0d2c42 18%,
      #0a2038 38%,
      #071628 58%,
      #050f1c 78%,
      #020810 100%);
    opacity:var(--sp);
  }

  .light-rays{
    position:absolute;
    top:0; left:0; right:0;
    height:70%;
    opacity:calc(0.55 * (1 - var(--sp)));
    background:
      linear-gradient(115deg, transparent 10%, rgba(255,255,255,0.18) 13%, transparent 18%),
      linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.14) 34%, transparent 40%),
      linear-gradient(120deg, transparent 55%, rgba(255,255,255,0.12) 59%, transparent 65%),
      linear-gradient(110deg, transparent 75%, rgba(255,255,255,0.16) 79%, transparent 85%);
    animation:sway 9s ease-in-out infinite;
  }
  @keyframes sway{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(-20px);}
  }

  .particles{position:absolute; inset:0;}
  .mote{
    position:absolute;
    width:3px; height:3px;
    background:rgba(255,255,255,0.55);
    border-radius:50%;
    animation:rise linear infinite;
  }
  .mote.glow{
    background:rgba(140,220,255,0.8);
    box-shadow:0 0 6px 2px rgba(140,220,255,0.5);
    opacity:var(--sp);
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0); opacity:0;}
    10%{opacity:0.8;}
    90%{opacity:0.5;}
    100%{transform:translateY(-110vh) translateX(20px); opacity:0;}
  }

  .fish{
    position:absolute;
    animation-name:swim;
